name: Vale Lint (pull requests)

on:
  pull_request:
    paths:
      - 'test-vale/**'

jobs:
  vale:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v46
        with:
          files: |
            test-vale/**/*.md
            test-vale/**/*.yaml
            test-vale/**/*.yml
            test-vale/**/*.txt

      # Inline comments: errors only, on changed lines. github-pr-check uses the
      # Checks API, which batches at 50 annotations per request. github-pr-review
      # packs them all into one request that GitHub truncates around 100.
      - name: Vale — inline comments (errors only)
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: errata-ai/vale-action@reviewdog
        with:
          files: test-vale
          version: 3.9.4
          min_alert_level: error
          filter_mode: added
          reporter: github-pr-check
          fail_on_error: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Full report, every severity, in the run summary. Deliberately NOT a
      # reviewdog reporter: those emit annotations that surface inline in Files
      # Changed, and inline output is meant to stay errors-only.
      - name: Vale — full report (all severities)
        if: ${{ !cancelled() && steps.changed-files.outputs.any_changed == 'true' }}
        run: |
          curl -sSfL https://github.com/errata-ai/vale/releases/download/v3.9.4/vale_3.9.4_Linux_64-bit.tar.gz \
            | tar -xz -C /tmp vale
          mkdir -p styles/Vocab/Blog
          /tmp/vale --no-exit --output=JSON --minAlertLevel=suggestion test-vale > vale.json
          python3 .github/scripts/vale-summary.py vale.json >> "$GITHUB_STEP_SUMMARY"
