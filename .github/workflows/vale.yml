name: Vale Lint (diff only)

on:
  push:
    paths:
      - 'test-vale/**'
  pull_request:
    paths:
      - 'test-vale/**'

jobs:
  vale:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v46
        with:
          files: |
            test-vale/**/*.md
            test-vale/**/*.yaml
            test-vale/**/*.yml
            test-vale/**/*.txt

      # Errors only, inline on changed lines. Uses the Checks API, which batches
      # at 50 annotations per request — github-pr-review packs them into a single
      # request and GitHub truncates it around 100, dropping most findings.
      - name: Run Vale (PR — inline comments, errors only)
        if: steps.changed-files.outputs.any_changed == 'true' && github.event_name == 'pull_request'
        uses: errata-ai/vale-action@reviewdog
        with:
          files: test-vale
          version: 3.9.4
          min_alert_level: error
          filter_mode: added
          reporter: github-pr-check
          fail_on_error: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Full report: every severity, every line, in the Actions run.
      - name: Run Vale (push — full report, all severities)
        if: steps.changed-files.outputs.any_changed == 'true' && github.event_name == 'push'
        uses: errata-ai/vale-action@reviewdog
        with:
          files: test-vale
          version: 3.9.4
          min_alert_level: suggestion
          filter_mode: nofilter
          reporter: github-check
          fail_on_error: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
