name: Vale Lint (diff only)

on:
  push:
    paths:
      - 'test-vale/**'
  pull_request:
    paths:
      - 'test-vale/**'

jobs:
  vale:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v46
        with:
          files: |
            test-vale/**/*.md
            test-vale/**/*.yaml
            test-vale/**/*.yml
            test-vale/**/*.txt

      # 150 findings is far more than one Review API request carries, so
      # github-pr-review silently drops most of them. The Checks API batches at
      # 50 annotations per request, so github-pr-check delivers all of them.
      - name: Run Vale (PR — inline annotations on changed lines)
        if: steps.changed-files.outputs.any_changed == 'true' && github.event_name == 'pull_request'
        uses: errata-ai/vale-action@reviewdog
        with:
          files: test-vale
          version: 3.9.4
          min_alert_level: suggestion
          filter_mode: added
          reporter: github-pr-check
          fail_on_error: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Full detail, every severity, in the Actions run — no API payload limit.
      - name: Run Vale (push — full report in action log)
        if: steps.changed-files.outputs.any_changed == 'true' && github.event_name == 'push'
        uses: errata-ai/vale-action@reviewdog
        with:
          files: test-vale
          version: 3.9.4
          min_alert_level: suggestion
          filter_mode: nofilter
          reporter: github-check
          fail_on_error: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
