name: Vale Lint (pull requests)

on:
  pull_request:
    paths:
      - 'test-vale/**'

jobs:
  vale:
    runs-on: ubuntu-latest
    concurrency:
      group: vale-${{ github.workflow }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v46
        with:
          files: |
            test-vale/**/*.md
            test-vale/**/*.yaml
            test-vale/**/*.yml
            test-vale/**/*.txt

      - name: Vale — full report (all severities)
        if: ${{ !cancelled() && steps.changed-files.outputs.any_changed == 'true' }}
        id: vale-report
        run: |
          curl -sSfL https://github.com/errata-ai/vale/releases/download/v3.9.4/vale_3.9.4_Linux_64-bit.tar.gz \
            | tar -xz -C /tmp vale
          mkdir -p styles/Vocab/Blog
          /tmp/vale --no-exit --output=JSON --minAlertLevel=suggestion test-vale > vale.json
          python3 .github/scripts/vale-summary.py vale.json >> "$GITHUB_STEP_SUMMARY"

      - name: Vale — inline comments (errors only)
        if: ${{ !cancelled() && steps.vale-report.outcome == 'success' }}
        uses: actions/github-script@v7
        with:
          retries: 0
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const pull_number = context.issue.number;
            const commit_id = context.payload.pull_request.head.sha;
            const report = JSON.parse(fs.readFileSync('vale.json', 'utf8'));
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number, per_page: 100
            });
            const addedLines = new Map();
            for (const file of files) {
              if (!/^test-vale\/.*\.(md|yaml|yml|txt)$/.test(file.filename)) continue;
              const lines = new Set();
              let line = 0;
              for (const text of (file.patch || '').split('\n')) {
                const hunk = /^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@/.exec(text);
                if (hunk) {
                  line = Number(hunk[1]);
                } else if (text.startsWith('+')) {
                  lines.add(line++);
                } else if (text.startsWith(' ')) {
                  line++;
                }
              }
              addedLines.set(file.filename, lines);
              if (!file.patch && file.status !== 'removed') {
                core.warning(`No diff available for ${file.filename}; inline findings skipped.`);
              }
            }
            const existing = await github.paginate(github.rest.pulls.listReviewComments, {
              owner, repo, pull_number, per_page: 100
            });
            const key = comment => JSON.stringify([comment.path, comment.line, comment.body]);
            const posted = new Set(existing
              .filter(comment => comment.user?.type === 'Bot' && comment.side === 'RIGHT')
              .map(key));
            const comments = [];
            let eligible = 0;
            for (const [filename, alerts] of Object.entries(report)) {
              const path = filename.replaceAll('\\', '/').replace(/^\.\//, '');
              for (const alert of alerts) {
                if (alert.Severity !== 'error' || !addedLines.get(path)?.has(alert.Line)) continue;
                eligible++;
                const comment = {
                  path, line: alert.Line, side: 'RIGHT',
                  body: `**Vale: ${alert.Check}**\n\n${alert.Message}\n\n<!-- vale-inline -->`
                };
                const fingerprint = key(comment);
                if (posted.has(fingerprint)) continue;
                posted.add(fingerprint);
                comments.push(comment);
              }
            }
            const pause = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
            const postReview = async batch => {
              for (let attempt = 0; ; attempt++) {
                try {
                  await github.rest.pulls.createReview({
                    owner, repo, pull_number, commit_id, event: 'COMMENT', comments: batch
                  });
                  return;
                } catch (error) {
                  const headers = error.response?.headers || {};
                  const rateLimited = error.status === 429 || (error.status === 403 && (
                    headers['retry-after'] !== undefined || headers['x-ratelimit-remaining'] === '0' ||
                    /secondary rate limit|abuse detection|rate limit exceeded/i.test(error.message)
                  ));
                  if (!rateLimited || attempt >= 3) throw error;
                  let delay = 60000 * (2 ** attempt);
                  const retryAfter = headers['retry-after'];
                  if (retryAfter !== undefined) {
                    const seconds = Number(retryAfter);
                    const requestedDelay = Number.isFinite(seconds)
                      ? seconds * 1000 : Date.parse(retryAfter) - Date.now();
                    if (Number.isFinite(requestedDelay)) delay = Math.max(delay, requestedDelay);
                  }
                  if (headers['x-ratelimit-remaining'] === '0') {
                    const resetDelay = Number(headers['x-ratelimit-reset']) * 1000 - Date.now();
                    if (Number.isFinite(resetDelay)) delay = Math.max(delay, resetDelay + 1000);
                  }
                  core.warning(`GitHub rate limit: retrying this batch in ${Math.ceil(delay / 1000)} seconds (${attempt + 1}/3).`);
                  await pause(delay);
                }
              }
            };
            let published = 0;
            try {
              for (let offset = 0; offset < comments.length; offset += 30) {
                const batch = comments.slice(offset, offset + 30);
                if (offset > 0) await pause(60000);
                await postReview(batch);
                published += batch.length;
              }
            } finally {
              await core.summary.addRaw(
                `\n### Vale inline comments\n\n${eligible} errors on added lines; ` +
                `${published} new comments posted; ${comments.length - published} pending.\n`
              ).write();
            }
