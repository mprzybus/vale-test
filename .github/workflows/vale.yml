name: Vale Lint (diff only)

on:
  push:
    paths:
      - 'test-vale/**'
  pull_request:
    paths:
      - 'test-vale/**'

jobs:
  vale:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v46
        with:
          files: |
            test-vale/**/*.md
            test-vale/**/*.yaml
            test-vale/**/*.yml
            test-vale/**/*.txt

      - name: Run Vale on changed files (PR with inline comments)
        if: steps.changed-files.outputs.any_changed == 'true' && github.event_name == 'pull_request'
        uses: errata-ai/vale-action@reviewdog
        with:
          files: test-vale
          version: 3.9.4
          fail_on_error: false
          reporter: github-pr-review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Vale on changed files (push with action logs)
        if: steps.changed-files.outputs.any_changed == 'true' && github.event_name == 'push'
        uses: errata-ai/vale-action@reviewdog
        with:
          files: test-vale
          version: 3.9.4
          fail_on_error: false
          reporter: github-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
